# adacpp >=0.31 builds against either ifcopenshell line (Krande/adacpp#69): 0.8.x via the static
# libIfcParse.a / libIfcGeom.a, 0.9 via the shared libs + CMake package. Build both while 0.9 is
# new; each variant's run_exports pins the runtime to its own ifcopenshell x.x.x, so the solver
# picks the ada-cpp build matching the environment's ifcopenshell.
ifcopenshell:
  - 0.8.5
  - 0.9.0
