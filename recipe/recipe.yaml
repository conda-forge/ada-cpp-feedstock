schema_version: 1

context:
  name: ada-cpp
  version: "0.23.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/Krande/adacpp/archive/refs/tags/v${{ version }}.tar.gz
    sha256: f2fab8f2dd811f75750870f570cf84e09fe674d3958c814d6f24f871258478d8

build:
  number: 0
  skip: match(python, "<3.10")

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # linux, NOT unix: `cdt()` resolves to a CentOS sysroot package
    # (mesa-libgl-devel-cos6-<arch>), and those are published for Linux
    # architectures only. `mesa-libgl-devel-cos6-x86_64` happens to exist, so
    # under `unix` the osx-64 build quietly installed a Linux sysroot package it
    # never used and passed anyway; osx-arm64 asks for
    # `mesa-libgl-devel-cos6-arm64`, which does not exist, and the solve fails.
    # macOS gets OpenGL from the system framework and needs no CDT either way.
    - if: linux
      then: ${{ cdt('mesa-libGL-devel') }}
    # Cross-compiling osx-arm64 from an osx-64 builder means the HOST python is
    # an arm64 binary the builder cannot execute. `cross-python_<target>` supplies
    # a runnable interpreter configured for the target, which is what lets CMake's
    # find_package(Python) answer correctly instead of falling back to whatever
    # python is on PATH -- on CI that was the runner's own pixi env (3.10).
    #
    # nanobind is here as well because cmake/build_python.cmake shells out to
    # `${Python_EXECUTABLE} -m nanobind --cmake_dir` before find_package(nanobind),
    # so it must be IMPORTABLE at build time, not merely present in host. It is a
    # noarch, header-only binding library, so the build env's copy is the same
    # code the target compiles against.
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - nanobind
    - cmake
    - ninja
  host:
    - python
    - occt
    - ifcopenshell >=0.8.5
    - rocksdb >=10.6.2
    - zlib
    - cgal-cpp
    - nanobind
    - cli11
    - tinygltf
    - gmsh
    - pip
    - setuptools
    - wheel
  run:
    - python
    - ${{ pin_compatible('gmsh', upper_bound='x.x') }}
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x.x') }}
  # ifcopenshell and rocksdb are build-time-only: both are linked STATICALLY, so
  # nothing in the installed extension module resolves against them at runtime,
  # and their run_exports would otherwise make every ada-cpp install drag in the
  # whole IfcOpenShell + RocksDB runtime closure for code that is already baked
  # into the .so.
  #
  #   * ifcopenshell -- cmake/deps_ifc.cmake links the static archives by name
  #     (IfcParse, IfcGeom, geometry_kernel_opencascade, geometry_kernel_cgal),
  #     inside a --start-group/--end-group so the mutual references resolve in
  #     one pass. There is no libIfcParse.so in the link line.
  #
  #   * rocksdb -- deliberately the STATIC RocksDB::rocksdb target. ifcopenshell
  #     >=0.8.5 embeds rocksdb inside libIfcParse.a, so loading the shared
  #     librocksdb as well would put a second instance in the process (ODR
  #     conflict, heap corruption on IfcFile ctor/dtor). Advertising a runtime
  #     dependency on it therefore points at a library this package must NOT
  #     load -- dropping it is a correctness fix, not only a size one.
  #
  # Both stay in `host:` above: they are still compiled and linked against, and
  # the version bounds there still pin the ABI the archives were built for.
  #
  # occt, gmsh and libzlib are genuinely dynamic and stay as runtime deps.
  # cgal-cpp is header-only and exports nothing, so it needs no entry here.
  #
  # This is self-verifying: everything ships in one extension module, so a
  # shared library that really were needed would fail to resolve at import, and
  # the `pytest tests` phase below runs in an environment built from `run:`
  # alone.
  ignore_run_exports:
    by_name:
      - ifcopenshell
      - rocksdb

tests:
  - files:
      source:
        - tests
        - files
    requirements:
      run:
        - pytest
    script:
      - pytest tests

about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A module with drop-in replacement functions for ada-py written in c++ to improve performance.
  homepage: https://github.com/Krande/adacpp

extra:
  recipe-maintainers:
    - Krande
